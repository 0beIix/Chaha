---
# site.yml - Master Playbook para Chahã

## 1. PREPARACIÓN GLOBAL
- name: Preparar dependencias en todos los nodos
  hosts: sensor_nodes
  become: yes
  tasks:
    - name: Actualizar cache de APT
      apt:
        update_cache: yes
        cache_valid_time: 3600

## 2. DESPLIEGUE DEL NODO CENTRAL (MASTER) - Wazuh AIO
