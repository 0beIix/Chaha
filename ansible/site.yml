## 3. DESPLIEGUE DE SENSORES (IDS/NSM)

- name: Deploy Suricata (IDS)
  hosts: sensor_nodes
  become: yes
  roles:
    - role: suricata

- name: Deploy Zeek (NSM)
  hosts: sensor_nodes
  become: yes
  roles:
    - role: zeek

- name: Deploy Wazuh Agents (Sensors)
  hosts: sensor_nodes
  become: yes
  roles:
    - role: wazuh.ansible-wazuh-agent

## 4. VERIFICACIÓN FINAL
- name: Resumen del despliegue
  hosts: wazuh_nodes
  become: yes
  tasks:
    - name: Mostrar ubicación de contraseñas
      debug:
        msg: "El despliegue ha finalizado. Puedes encontrar las contraseñas del Dashboard en /root/wazuh-passwords.txt en el servidor Master."
