---
- name: Install dependencies
  apt:
    name:
      - curl
      - gnupg
      - ca-certificates
    state: present
    update_cache: true

- name: Add Wazuh GPG key
  shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH \
    | gpg --dearmor \
    > /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    filename: wazuh
    state: present
    update_cache: true

- name: Install Wazuh agent
  apt:
    name: "{{ wazuh_agent_package }}"
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"

- name: Configure Wazuh manager address
  lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '^\s*<address>.*</address>'
    line: "      <address>{{ wazuh_manager_ip }}</address>"
  notify: restart wazuh-agent

- name: Add Suricata localfile collection
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED SURICATA LOG COLLECTION -->"
    insertbefore: "</ossec_config>"
    block: |
      <localfile>
        <log_format>json</log_format>
        <location>{{ suricata_eve_log }}</location>
      </localfile>
  when: wazuh_collect_suricata
  notify: restart wazuh-agent

- name: Add Zeek localfile collection
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED ZEEK LOG COLLECTION -->"
    insertbefore: "</ossec_config>"
    block: |
      <localfile>
        <log_format>json</log_format>
        <location>{{ zeek_log_dir }}/*.log</location>
      </localfile>

  when: wazuh_collect_zeek
  notify: restart wazuh-agent

- name: Enable and start Wazuh agent
  systemd:
    name: wazuh-agent
    enabled: true
    state: started