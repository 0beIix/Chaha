---
- name: Instalar Suricata y dependencias
  apt:
    name: 
      - suricata
      - suricata-update
      - jq
      - python3-pip
    state: present
    update_cache: yes

- name: Optimizar Interfaz de Monitoreo (Desactivar Offloading)
  shell: |
    ethtool -K {{ sniff_interface }} gro off lro off tso off gso off
  ignore_errors: yes

- name: Habilitar modo promiscuo en la interfaz de monitoreo
  shell: |
    ip link set dev {{ sniff_interface }} promisc on && ip link set dev {{ sniff_interface }} up
  ignore_errors: yes
  # Esto asegura que Suricata vea los paquetes originales, no "reensamblados" por la NIC.

### Configuración de Suricata
- name: Configurar HOME_NET
  replace:
    path: /etc/suricata/suricata.yaml
    regexp: 'HOME_NET: "\[[^"]+\]"'
    replace: 'HOME_NET: "[{{ home_net }}]"'

- name: Configurar la interfaz de monitoreo
  replace:
    path: /etc/suricata/suricata.yaml
    regexp: 'interface: .+'
    replace: 'interface: {{ sniff_interface }}'

- name: Preparar fuentes de reglas y actualizar Suricata
  vars:
    antiphishing_dir: "/var/lib/chaha/suricata/antiphishing/{{ suricata_antiphishing_commit }}"
    daffainfo_dir: "/var/lib/chaha/suricata/daffainfo/{{ suricata_daffainfo_commit }}"
  block:
    - name: Preparar reglas comunitarias
      ansible.builtin.import_tasks: community-rules.yml

    - name: Instalar el actualizador de reglas de Chahã
      ansible.builtin.template:
        src: chaha-suricata-update.sh.j2
        dest: /usr/local/sbin/chaha-suricata-update
        owner: root
        group: root
        mode: "0755"
        validate: /bin/bash -n %s

    - name: Actualizar y validar las reglas antes de reiniciar Suricata
      ansible.builtin.command: /usr/local/sbin/chaha-suricata-update --restart
      changed_when: true

- name: Programar actualización diaria de reglas Suricata a las 05:00
  cron:
    name: "Actualizar reglas Suricata"
    minute: "0"
    hour: "5"
    user: root
    job: "/usr/local/sbin/chaha-suricata-update >/var/log/suricata-update.log 2>&1"
    state: present

- name: Asegurar que Suricata inicie al boot
  service:
    name: suricata
    enabled: yes
    state: started

- name: Configurar interfaz de captura
  copy:
    dest: /etc/systemd/system/promisc-interface.service
    content: |
      [Unit]
      Description=Preparar interfaz {{ sniff_interface }} para Suricata
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ip link set dev {{ sniff_interface }} up
      ExecStart=/usr/sbin/ip link set dev {{ sniff_interface }} promisc on
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

- name: Habilitar servicio promisc
  systemd:
    name: promisc-interface
    enabled: yes
    state: started

